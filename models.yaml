# Model inventory — the ONLY source of model availability (SPECS principle 6). Edit per machine; router adapts.
hardware:
  gpu: RTX 3050 Laptop
  vram_gb: 6
  ram_gb: 14

backends:
  ollama:
    endpoint: http://localhost:11434

models:
  # tags are placeholders until D0.2 microbench fixes real ones (check ollama.com/library)
  - id: qwen3.5:4b
    backend: ollama
    vram_gb: 3.5
    ctx_max: 32768
    capabilities: [general, tool-call, fold, decompose]
    default: true
  - id: phi4-mini
    backend: ollama
    vram_gb: 2.5
    ctx_max: 16384
    capabilities: [structured-output, verify]

cloud:
  enabled: false   # flip consciously; every cloud call is logged in traces with cost

roles: {}
  # optional pinning, e.g.  verifier: phi4-mini
  # unpinned roles resolve by capability match (dobra/router)
